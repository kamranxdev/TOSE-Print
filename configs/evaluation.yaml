# Evaluation Protocol Configuration (SOCOFing / Benchmark standard)

dataset:
  name: "SOCOFing"
  data_dir: "data/SOCOFing"
  gallery_dir: "Real"
  probe_dirs:
    - "Altered/Altered-Easy"
    - "Altered/Altered-Medium"
    - "Altered/Altered-Hard"

protocol:
  train_subject_ratio: 0.3333333333333333
  test_subject_ratio: 0.6666666666666666
  seed: 42
  num_impostor_pairs: 100000
  bootstrap_iterations: 1000
  confidence_level: 0.95

metrics:
  verification:
    - "EER"
    - "FMR100"
    - "FMR1000"
    - "ZeroFMR"
    - "AUC"
  identification:
    - "Rank-1"
    - "Rank-5"
    - "Rank-10"
    - "Rank-20"
    - "MRR"
