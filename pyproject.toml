[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tose-print"
version = "1.0.0"
description = "TOSE-Print: Topology + Orientation SE(2) Embedding for Scalable, Privacy-Preserving Fingerprint Recognition"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Research Team" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.7.0",
    "scikit-learn>=1.2.0",
    "scikit-image>=0.20.0",
    "faiss-cpu>=1.7.4",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
